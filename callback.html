
          <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conexão com Bling</title>
</head>

<body>

<h1>Conexão com Bling</h1>

<p id="mensagem">Finalizando conexão...</p>

<script>

async function conectar(){

  const mensagem = document.getElementById("mensagem");

  const params = new URLSearchParams(window.location.search);

  const code = params.get("code");

  if(!code){

    mensagem.innerHTML =
      "❌ Código de autorização não recebido.";

    return;

  }

  try{

    const resposta = await fetch("/api/bling",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        code:code
      })

    });

    const dados = await resposta.json();

    if(!resposta.ok || !dados.success){

      throw new Error(
        dados.error
        ? JSON.stringify(dados.error)
        : "Erro ao conectar com o Bling"
      );

    }

    localStorage.setItem(
      "bling_access_token",
      dados.access_token
    );

    if(dados.refresh_token){

      localStorage.setItem(
        "bling_refresh_token",
        dados.refresh_token
      );

    }

    mensagem.innerHTML =
      "<h2>✅ Bling conectado com sucesso!</h2>" +
      "<p>Redirecionando para o painel...</p>";

    setTimeout(function(){

      window.location.href = "/";

    },1500);

  }catch(error){

    mensagem.innerHTML =
      "<h2>❌ Erro ao finalizar conexão com o Bling.</h2>" +
      "<p>" + error.message + "</p>";

  }

}

conectar();

</script>

</body>
</html>
