<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conexão com Bling</title>
</head>
<body>
  <h2>Conexão com Bling</h2>
  <p id="status">Finalizando conexão...</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");

    const status = document.getElementById("status");

    async function conectarBling() {
      if (error) {
        status.textContent = "A autorização foi recusada pelo Bling.";
        return;
      }

      if (!code) {
        status.textContent = "Código de autorização não encontrado.";
        return;
      }

      try {
        const response = await fetch("/api/bling", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ code })
        });

        const data = await response.json();

       if (!response.ok) {
  console.error("Erro retornado pela API:", data);

  status.innerHTML =
    "Erro ao finalizar a conexão com o Bling.<br><br>" +
    "<strong>Detalhes:</strong><br>" +
    JSON.stringify(data, null, 2)

  return;
}

        status.textContent =
          "Bling conectado com sucesso!";

        console.log("Bling conectado:", data);

      } catch (err) {
        console.error(err);
        status.textContent =
          "Erro de comunicação com o servidor.";
      }
    }

    conectarBling();
  </script>
</body>
</html>
