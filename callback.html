
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conexão com Bling</title>
</head>

<body>

<h2>Conexão com Bling</h2>

<p id="status">Finalizando conexão...</p>

<script>

const params = new URLSearchParams(window.location.search);
const code = params.get("code");
const error = params.get("error");

const status = document.getElementById("status");

async function conectarBling() {

  if (error) {
    status.textContent = "A autorização foi recusada pelo Bling.";
    return;
  }

  if (!code) {
    status.textContent = "Código de autorização não encontrado.";
    return;
  }

  try {

    const response = await fetch("/api/bling", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        code: code
      })
    });

    const data = await response.json();

    if (!response.ok) {

      status.innerHTML =
        "Erro ao finalizar a conexão com o Bling.<br><br>" +
        "<strong>Detalhes:</strong><br>" +
        JSON.stringify(data);

      return;
    }

    /*
      GUARDA OS TOKENS PARA O PAINEL
    */

    localStorage.setItem(
      "bling_access_token",
      data.access_token
    );

    localStorage.setItem(
      "bling_refresh_token",
      data.refresh_token
    );

    localStorage.setItem(
      "bling_conectado",
      "true"
    );

    status.textContent = "Bling conectado com sucesso!";

    /*
      VOLTA PARA O PAINEL
    */

    setTimeout(() => {

      window.location.href = "/";

    }, 1000);

  } catch (err) {

    console.error(err);

    status.textContent =
      "Erro de comunicação com o servidor.";

  }

}

conectarBling();

</script>

</body>
</html>
