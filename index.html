<script>

async function carregarDadosBling() {

  const accessToken =
    localStorage.getItem("bling_access_token");

  if (!accessToken) {

    console.log("Bling ainda não conectado.");

    return;
  }

  try {

    const response = await fetch("/api/bling-dados", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        access_token: accessToken
      })

    });

    const dados = await response.json();

    if (!response.ok) {

      console.error(
        "Erro ao buscar dados do Bling:",
        dados
      );

      return;
    }

    console.log("Dados recebidos do Bling:", dados);

    const produtos = dados.produtos || [];
    const pedidos = dados.pedidos || [];

    /*
      PRODUTOS
    */

    const produtosSection =
      document.querySelector(".section:nth-of-type(3)");

    if (produtosSection) {

      produtosSection.innerHTML = `
        <h2>Produtos</h2>
        <p>
          ${produtos.length}
          produtos carregados do Bling.
        </p>
      `;

    }

    /*
      PEDIDOS
    */

    const tabela =
      document.querySelector("tbody");

    if (tabela && pedidos.length > 0) {

      tabela.innerHTML = pedidos.map(pedido => {

        const numero =
          pedido.numero || pedido.id || "-";

        const valor =
          Number(pedido.total || 0);

        return `
          <tr>

            <td>${numero}</td>

            <td>Bling</td>

            <td>
              ${pedido.contato?.nome || "Pedido de venda"}
            </td>

            <td>
              R$ ${valor.toLocaleString(
                "pt-BR",
                {
                  minimumFractionDigits: 2
                }
              )}
            </td>

            <td>—</td>

          </tr>
        `;

      }).join("");

    }

  } catch (erro) {

    console.error(
      "Erro na integração:",
      erro
    );

  }

}


/*
  CARREGA AUTOMATICAMENTE
*/

carregarDadosBling();

</script>
